name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      # The plugin supports Moodle 4.4 and later (see version.php $plugin->requires).
      # Each entry pairs a branch with a PHP version that branch actually supports:
      # Moodle 4.4/4.5 require PHP 8.1+, 5.0/5.1 require PHP 8.2+, 5.2 requires PHP 8.3+.
      matrix:
        include:
          - {moodle-branch: 'MOODLE_404_STABLE', php: '8.1', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql'}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  # Packages the plugin and publishes it when a v* tag is pushed. Depends on
  # `test`, so a tag whose code fails CI never produces a release.
  release:
    name: Publish release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the tag matches version.php
        run: |
          tag="${GITHUB_REF_NAME#v}"
          release=$(sed -n 's/^\$plugin->release *= *'\''\([^'\'']*\)'\''.*/\1/p' version.php)
          echo "tag: $tag / version.php release: $release"
          if [ "$tag" != "$release" ]; then
            echo "::error::Tag v$tag does not match \$plugin->release '$release' in version.php."
            exit 1
          fi

      - name: Build the plugin ZIP
        run: |
          # Every tracked file is included except those marked export-ignore in
          # .gitattributes, so newly added files ship without touching this job.
          git archive --format=zip --prefix=quizidnumber/ -o local_quizidnumber.zip HEAD
          unzip -l local_quizidnumber.zip

      - name: Extract the release notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG section found for $version; falling back to generated notes."
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="$tag — Quiz student ID number"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Release already exists (created by hand); just attach the ZIP.
            gh release upload "$tag" local_quizidnumber.zip --clobber
          elif [ -s notes.md ]; then
            gh release create "$tag" local_quizidnumber.zip --title "$title" --notes-file notes.md
          else
            gh release create "$tag" local_quizidnumber.zip --title "$title" --generate-notes
          fi
